<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madeleine Home — Monthly Targets</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --text: #1c1f26;
    --text-muted: #6b7280;
    --accent: #1f3a5f;
    --accent-soft: #e8edf3;
    --good: #1a9c5c;
    --warn: #b45309;
    --bad: #c0392b;
    --track: #edeff2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    max-width: 1150px;
    margin: 0 auto;
    padding: 24px 32px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 21px; margin: 0 0 4px; }
  header .sub { color: var(--text-muted); font-size: 13px; }
  .logo { flex-shrink: 0; opacity: 0.85; }
  .controls {
    max-width: 1150px;
    margin: 0 auto;
    padding: 0 32px 8px;
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .filter { display: flex; flex-direction: column; gap: 4px; }
  .filter > label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--text-muted);
  }
  select {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
  }
  /* custom multi-select */
  .ms { position: relative; }
  .ms-btn {
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
    cursor: pointer; min-width: 160px; text-align: left;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .ms-btn::after { content: "▾"; color: var(--text-muted); font-size: 11px; }
  .ms-panel {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; min-width: 190px;
    max-height: 300px; overflow-y: auto; display: none;
  }
  .ms.open .ms-panel { display: block; }
  .ms-opt {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    font-size: 13px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .ms-opt:hover { background: var(--accent-soft); }
  .ms-opt input { accent-color: var(--accent); width: 15px; height: 15px; }
  .ms-divider { height: 1px; background: var(--border); margin: 4px 2px; }
  main { max-width: 1150px; margin: 0 auto; padding: 0 32px 60px; }
  #status { color: var(--text-muted); font-size: 14px; padding: 40px 0; }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-muted);
    margin: 24px 0 8px;
  }
  .section-label:first-child { margin-top: 4px; }

  .region-grid, .overall-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .region-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .region-card .name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
  .stat-card .value { font-size: 20px; font-weight: 600; margin-top: 4px; }

  .channel-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .channel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; cursor: pointer; gap: 16px; flex-wrap: wrap;
  }
  .channel-name-block { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .channel-name { font-weight: 600; font-size: 15px; }
  .region-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--track); color: var(--text-muted); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #fdf1e6; color: var(--warn); }
  .badge-info { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .channel-only-note { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .status-ahead { background: #e5f6ec; color: var(--good); }
  .status-ontrack { background: #fdf1e0; color: var(--warn); }
  .status-behind { background: #fbe9e7; color: var(--bad); }

  .progress-block { flex: 1; min-width: 220px; }
  .progress-track { background: var(--track); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .progress-fill.good { background: var(--good); }
  .progress-fill.warn { background: var(--warn); }
  .progress-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .pct-block { text-align: right; min-width: 70px; font-weight: 600; }
  .toggle-icon { transition: transform .15s ease; color: var(--text-muted); }
  .channel-card.open .toggle-icon { transform: rotate(90deg); }

  .sku-table-wrap { display: none; border-top: 1px solid var(--border); padding: 8px 18px 16px; }
  .channel-card.open .sku-table-wrap { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; vertical-align: middle; }
  th { color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  tr:nth-child(even) td { background: #fafbfc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .no-data-row td { color: var(--text-muted); font-style: italic; }
  .sku-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); vertical-align: middle; background: #fff; cursor: zoom-in; }
  .sku-thumb-empty { width: 32px; height: 32px; border-radius: 4px; background: var(--track); display: inline-block; }

  /* Click-to-enlarge image lightbox */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0, 0, 0, 0.75); cursor: zoom-out;
    align-items: center; justify-content: center; padding: 24px;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 90vw; max-height: 90vh; border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5); background: #fff;
  }

  /* Category > listing > SKU drill-down rows */
  .tree-row .caret-cell { width: 44px; color: var(--text-muted); font-size: 10px; }
  .tree-row.expandable { cursor: pointer; }
  .tree-row.expandable:hover td { background: var(--accent-soft); }
  .tree-row.lvl-cat .name-cell { font-weight: 600; }
  .tree-row.lvl-cat.is-open td { background: #eef2f7; }
  .tree-row.lvl-listing .name-cell { font-weight: 500; padding-left: 22px; }
  .tree-row.lvl-listing .caret-cell { padding-left: 14px; }
  .tree-row.lvl-listing.is-open td { background: #f2f5f9; }
  .tree-row.lvl-sku .name-cell { padding-left: 40px; color: var(--text-muted); }

  footer { text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px 0 40px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Madeleine Home — Monthly Targets</h1>
    <div class="sub" id="subheader">Loading...</div>
  </div>
  <div class="logo">
    <svg width="72" height="52" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="180" height="108" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
      <text x="100" y="76" font-size="40" font-family="Georgia, 'Times New Roman', serif" letter-spacing="18" text-anchor="middle" fill="#8a8a8a">M H</text>
      <line x1="32" y1="118" x2="58" y2="118" stroke="#8a8a8a" stroke-width="1"/>
      <text x="100" y="124" font-size="13" letter-spacing="4" font-family="Arial, sans-serif" text-anchor="middle" fill="#8a8a8a">LONDON</text>
      <line x1="142" y1="118" x2="168" y2="118" stroke="#8a8a8a" stroke-width="1"/>
    </svg>
  </div>
</header>
<div class="controls">
  <div class="filter">
    <label>Year</label>
    <div class="ms" id="yearMs">
      <button type="button" class="ms-btn" id="yearMsBtn" onclick="toggleMs(event,'yearMs')">All years</button>
      <div class="ms-panel" id="yearMsPanel"></div>
    </div>
  </div>
  <div class="filter">
    <label>Month</label>
    <div class="ms" id="monthMs">
      <button type="button" class="ms-btn" id="monthMsBtn" onclick="toggleMs(event,'monthMs')">All months</button>
      <div class="ms-panel" id="monthMsPanel"></div>
    </div>
  </div>
  <div class="filter">
    <label>Region</label>
    <select id="regionSelect" onchange="onRegionChange()">
      <option value="ALL">Select all</option>
      <option value="MH US">MH US</option>
      <option value="MH EU">MH EU</option>
    </select>
  </div>
</div>
<main>
  <div id="status">Loading dashboard data...</div>
  <div id="regionSection" style="display:none;">
    <div class="section-label">By region</div>
    <div id="regions" class="region-grid"></div>
  </div>
  <div id="overallSection" style="display:none;">
    <div class="section-label">Overall</div>
    <div id="overall" class="overall-grid"></div>
  </div>
  <div id="channelSection" style="display:none;">
    <div class="section-label">By channel</div>
    <div id="channels"></div>
  </div>
</main>
<footer id="footer"></footer>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" alt="">
</div>

<script>
// ---------------------------------------------------------------------
// Pure helper functions (no DOM) -- kept separate so they're unit-testable.
// ---------------------------------------------------------------------
function pct(actual, target) {
  if (!target || target <= 0) return null;
  return (actual / target) * 100;
}

function fmtMoney(n) {
  return "$" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString();
}

function pctClass(p) {
  if (p === null) return "";
  if (p >= 90) return "good";
  if (p >= 50) return "";
  return "warn";
}

// Variance vs where the channel SHOULD be by the end of yesterday
// (target pro-rated by days completed). Positive = ahead of pace.
function statusInfo(actual, target, daysCompleted, daysInMonth) {
  if (!target || target <= 0) return null;              // no target set
  if (!daysCompleted || daysCompleted <= 0) return null; // month hasn't really started
  if (!daysInMonth || daysInMonth <= 0) return null;
  const expected = target * (daysCompleted / daysInMonth);
  if (expected <= 0) return null;
  const variance = ((actual - expected) / expected) * 100;
  const sign = variance >= 0 ? "+" : "";
  const label = sign + variance.toFixed(0) + "%";
  if (variance < -5) return { text: "Behind (" + label + ")", cls: "status-behind" };
  if (variance > 5) return { text: "Ahead (" + label + ")", cls: "status-ahead" };
  return { text: "On track (" + label + ")", cls: "status-ontrack" };
}

function computeOverall(channels) {
  const targetableChannels = channels.filter(c => c.has_target_data);
  const totals = channels.reduce((acc, c) => {
    acc.target_revenue += c.target_revenue || 0;
    acc.actual_revenue += c.actual_revenue || 0;
    acc.target_units += c.target_units || 0;
    acc.actual_units += c.actual_units || 0;
    return acc;
  }, { target_revenue: 0, actual_revenue: 0, target_units: 0, actual_units: 0 });
  totals.overall_pct = pct(totals.actual_revenue, totals.target_revenue);
  totals.channels_with_targets = targetableChannels.length;
  totals.channels_total = channels.length;
  return totals;
}

function sortByAchievement(items) {
  return items.slice().sort((a, b) => {
    const pa = pct(a.actual_revenue, a.target_revenue);
    const pb = pct(b.actual_revenue, b.target_revenue);
    if (pa === null && pb === null) {
      const labelA = a.name || a.region || a.sku || "";
      const labelB = b.name || b.region || b.sku || "";
      return labelA.localeCompare(labelB);
    }
    if (pa === null) return 1;
    if (pb === null) return -1;
    return pa - pb;
  });
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function skuThumbHtml(url) {
  if (!url) return '<span class="sku-thumb-empty"></span>';
  return `<img class="sku-thumb" src="${encodeURI(url)}" loading="lazy" onclick="event.stopPropagation(); openLightbox(this.src)" onerror="this.outerHTML='<span class=&quot;sku-thumb-empty&quot;></span>'">`;
}

function openLightbox(url) {
  const box = document.getElementById("lightbox");
  document.getElementById("lightboxImg").src = url;
  box.classList.add("open");
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

const DETAILS_MISSING = "Details not provided";

// Which SKUs appear in a channel's drill-down.
//  - Channels WITH per-SKU targets: only SKUs that are part of the target plan.
//  - Actuals-only channels (no target at all, e.g. the MH US "Other Sales
//    Channels" bucket): SKUs that actually sold.
function skuIncluded(s, channel) {
  const hasSkuTargets = channel && channel.target_source === "sku";
  if (hasSkuTargets) return (s.target_revenue || 0) > 0 || (s.target_units || 0) > 0;
  if (channel && channel.target_source === "none")
    return (s.actual_revenue || 0) > 0 || (s.actual_units || 0) > 0;
  return (s.target_revenue || 0) > 0 || (s.target_units || 0) > 0;
}

// Group a channel's SKUs into category -> listing -> SKUs, each level carrying
// summed target/actual units & revenue. Sorted by target revenue for target
// channels, or by actual revenue for actuals-only channels.
function buildCategoryTree(skus, channel) {
  const byActual = channel && channel.target_source === "none";
  const cats = {};
  (skus || []).filter(s => skuIncluded(s, channel)).forEach(s => {
    const catName = s.category || DETAILS_MISSING;
    const listingName = s.listing_name || DETAILS_MISSING;
    const cat = cats[catName] || (cats[catName] =
      { name: catName, target_units: 0, actual_units: 0, target_revenue: 0, actual_revenue: 0, listings: {} });
    const lst = cat.listings[listingName] || (cat.listings[listingName] =
      { name: listingName, target_units: 0, actual_units: 0, target_revenue: 0, actual_revenue: 0, skus: [] });
    for (const bucket of [cat, lst]) {
      bucket.target_units += s.target_units || 0;
      bucket.actual_units += s.actual_units || 0;
      bucket.target_revenue += s.target_revenue || 0;
      bucket.actual_revenue += s.actual_revenue || 0;
    }
    lst.skus.push(s);
  });
  const metric = it => byActual ? (it.actual_revenue || 0) : (it.target_revenue || 0);
  const byMetric = (a, b) => metric(b) - metric(a);
  return Object.values(cats).map(cat => ({
    ...cat,
    listings: Object.values(cat.listings).map(lst => ({
      ...lst, skus: lst.skus.slice().sort(byMetric),
    })).sort(byMetric),
  })).sort(byMetric);
}

// State: which channels are expanded, and (per channel) which category and
// which listing are open. Category/listing tracked by index into the sorted
// tree, which is stable across re-renders.
let CH_STATE = { channels: [], trees: [], daysCompleted: 0, daysInMonth: 0 };
const openChannels = new Set();
const openCat = {};      // channelIdx -> categoryIdx
const openListing = {};  // channelIdx -> listingIdx (within the open category)

function metricCells(item) {
  const p = pct(item.actual_revenue, item.target_revenue);
  return `<td class="num">${fmtNum(item.target_units)}</td>
          <td class="num">${fmtNum(item.actual_units)}</td>
          <td class="num">${fmtMoney(item.target_revenue)}</td>
          <td class="num">${fmtMoney(item.actual_revenue)}</td>
          <td class="num">${p === null ? "—" : p.toFixed(0) + "%"}</td>`;
}

function treeRowsHtml(idx) {
  const tree = CH_STATE.trees[idx] || [];
  if (!tree.length) {
    return `<tr class="no-data-row"><td colspan="7">No category breakdown available for this channel.</td></tr>`;
  }
  const rows = [];
  tree.forEach((cat, ci) => {
    const catOpen = openCat[idx] === ci;
    const cst = statusInfo(cat.actual_revenue, cat.target_revenue, CH_STATE.daysCompleted, CH_STATE.daysInMonth);
    const catStatusBadge = cst ? ` <span class="status-badge ${cst.cls}">${cst.text}</span>` : "";
    rows.push(`<tr class="tree-row lvl-cat expandable ${catOpen ? "is-open" : ""}" onclick="toggleCat(${idx},${ci})">
      <td class="caret-cell">${catOpen ? "▼" : "▶"}</td>
      <td class="name-cell">${escapeHtml(cat.name)}${catStatusBadge}</td>
      ${metricCells(cat)}
    </tr>`);
    if (!catOpen) return;
    cat.listings.forEach((lst, li) => {
      const lstOpen = openListing[idx] === li;
      rows.push(`<tr class="tree-row lvl-listing expandable ${lstOpen ? "is-open" : ""}" onclick="toggleListing(${idx},${li})">
        <td class="caret-cell">${lstOpen ? "▼" : "▶"}</td>
        <td class="name-cell">${escapeHtml(lst.name)}</td>
        ${metricCells(lst)}
      </tr>`);
      if (!lstOpen) return;
      lst.skus.forEach(s => {
        rows.push(`<tr class="tree-row lvl-sku">
          <td>${skuThumbHtml(s.image_url)}</td>
          <td class="name-cell">${escapeHtml(s.sku)}</td>
          ${metricCells(s)}
        </tr>`);
      });
    });
  });
  return rows.join("");
}

function channelCardHtml(c, idx) {
  const p = pct(c.actual_revenue, c.target_revenue);
  const pctLabel = p === null ? "no target" : p.toFixed(0) + "%";
  const barWidth = p === null ? 0 : Math.min(p, 100);
  const isChannelOnly = c.target_source === "channel_only";
  const isOpen = openChannels.has(idx);
  const badges = [];
  if (!c.has_actual_file) badges.push('<span class="badge">no actual data yet</span>');
  if (!c.has_target_data) badges.push('<span class="badge">no target set</span>');
  if (isChannelOnly) badges.push('<span class="badge-info">channel-level target only</span>');
  const status = c.has_target_data ? statusInfo(c.actual_revenue, c.target_revenue, CH_STATE.daysCompleted, CH_STATE.daysInMonth) : null;
  const statusBadge = status ? `<span class="status-badge ${status.cls}">${status.text}</span>` : "";

  const channelOnlyNote = isChannelOnly
    ? `<div class="channel-only-note">Target of ${fmtMoney(c.target_revenue)} is set at the channel level, not per SKU, so there's no category breakdown for this channel.</div>`
    : "";

  const tableHtml = isOpen ? `
      <div class="sku-table-wrap" style="display:block;">
        ${channelOnlyNote}
        <table>
          <thead><tr>
            <th></th><th>Category / Listing / SKU</th><th class="num">Target Units</th><th class="num">Actual Units</th>
            <th class="num">Target Revenue</th><th class="num">Actual Revenue</th><th class="num">%</th>
          </tr></thead>
          <tbody>${treeRowsHtml(idx)}</tbody>
        </table>
      </div>` : "";

  return `
    <div class="channel-card ${isOpen ? "open" : ""}" id="card-${idx}">
      <div class="channel-header" onclick="toggleChannel(${idx})">
        <div class="channel-name-block">
          <span class="toggle-icon">▶</span>
          <span class="channel-name">${escapeHtml(c.name)}</span>
          <span class="region-tag">${escapeHtml(c.region || "")}</span>
          ${badges.join("")}
          ${statusBadge}
        </div>
        <div class="progress-block">
          <div class="progress-track"><div class="progress-fill ${pctClass(p)}" style="width:${barWidth}%"></div></div>
          <div class="progress-labels">
            <span>${fmtMoney(c.actual_revenue)} actual</span>
            <span>${fmtMoney(c.target_revenue)} target</span>
          </div>
        </div>
        <div class="pct-block">${pctLabel}</div>
      </div>
      ${tableHtml}
    </div>`;
}

function renderChannels() {
  document.getElementById("channels").innerHTML =
    CH_STATE.channels.map((c, i) => channelCardHtml(c, i)).join("");
}

function toggleChannel(idx) {
  if (openChannels.has(idx)) {
    openChannels.delete(idx);
    delete openCat[idx];
    delete openListing[idx];
  } else {
    openChannels.add(idx);
  }
  renderChannels();
}

function toggleCat(idx, ci) {
  // Opening a different category auto-closes the previous one (and its listing).
  if (openCat[idx] === ci) {
    delete openCat[idx];
  } else {
    openCat[idx] = ci;
  }
  delete openListing[idx];
  renderChannels();
}

function toggleListing(idx, li) {
  if (openListing[idx] === li) {
    delete openListing[idx];
  } else {
    openListing[idx] = li;
  }
  renderChannels();
}

// Daily-average pacing across all channels combined. Sales are only complete
// through YESTERDAY, so both averages use days completed (excluding today):
//   Current  = actual so far / days completed through yesterday.
//   Required = revenue still needed / days remaining (today through month end).
function currentDailyAvg(actual, daysCompleted) {
  if (!daysCompleted || daysCompleted <= 0) return null;
  return actual / daysCompleted;
}
function requiredDailyAvg(target, actual, daysCompleted, daysInMonth) {
  const daysLeft = daysInMonth - daysCompleted;   // includes today
  if (daysLeft <= 0) return null;                 // month over — not applicable
  return Math.max(0, target - actual) / daysLeft;
}

function overallHtml(totals, daysCompleted, daysInMonth) {
  const curAvg = currentDailyAvg(totals.actual_revenue, daysCompleted);
  const reqAvg = requiredDailyAvg(totals.target_revenue, totals.actual_revenue, daysCompleted, daysInMonth);
  return `
    <div class="stat-card"><div class="label">Target Revenue</div><div class="value">${fmtMoney(totals.target_revenue)}</div></div>
    <div class="stat-card"><div class="label">Actual Revenue</div><div class="value">${fmtMoney(totals.actual_revenue)}</div></div>
    <div class="stat-card"><div class="label">% to Target</div><div class="value">${totals.overall_pct === null ? "—" : totals.overall_pct.toFixed(0) + "%"}</div></div>
    <div class="stat-card"><div class="label">Current Daily Avg</div><div class="value">${curAvg === null ? "—" : fmtMoney(curAvg)}</div></div>
    <div class="stat-card"><div class="label">Required Daily Avg</div><div class="value">${reqAvg === null ? "—" : fmtMoney(reqAvg)}</div></div>
  `;
}

function regionCardHtml(r) {
  const p = pct(r.actual_revenue, r.target_revenue);
  const width = p === null ? 0 : Math.min(p, 100);
  const pctLabel = p === null ? "—" : p.toFixed(0) + "%";
  return `
    <div class="region-card">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div class="name">${r.region}</div>
        <div style="font-weight:700; font-size:16px; color:var(--accent);">${pctLabel} <span style="font-size:11px; font-weight:500; color:var(--text-muted);">to target</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill ${pctClass(p)}" style="width:${width}%"></div></div>
      <div class="progress-labels" style="margin-top:6px;">
        <span>${fmtMoney(r.actual_revenue)} actual</span>
        <span>${fmtMoney(r.target_revenue)} target</span>
      </div>
      <div style="font-size:12px; color:var(--text-muted); margin-top:6px;">
        ${fmtNum(r.actual_units)} / ${fmtNum(r.target_units)} units
      </div>
    </div>`;
}

let CURRENT_MANIFEST = null;

// The month the dashboard should open on by default. The switch to a new
// month happens on the 2nd: on the 1st we still show the previous month,
// from the 2nd onward we show the current month. (Mirrors how the data
// itself rolls over.)
function effectiveCurrentMonth(now) {
  let y = now.getFullYear(), m = now.getMonth() + 1; // 1-12
  if (now.getDate() === 1) {
    m -= 1;
    if (m === 0) { m = 12; y -= 1; }
  }
  return { year: y, month: m };
}

function pickDefaultMonth(months, now) {
  const eff = effectiveCurrentMonth(now);
  const hit = months.find(m => m.year === eff.year && m.month === eff.month);
  return hit || months[0];   // fall back to newest if that month isn't published
}

// ---------------------------------------------------------------------
// Month + Year multi-select filters (Power BI style: the selection is the
// cross-product of chosen years x chosen months, aggregated together).
// ---------------------------------------------------------------------
const MONTH_NAMES = ["January","February","March","April","May","June",
  "July","August","September","October","November","December"];
let MANIFEST_MONTHS = [];        // [{year, month, label}]
let AVAILABLE_YEARS = [];        // ascending
let AVAILABLE_MONTHS = [];       // month numbers present, Jan->Dec
const selectedYears = new Set();
const selectedMonths = new Set();

function renderMsPanels() {
  const mp = document.getElementById("monthMsPanel");
  mp.innerHTML =
    `<label class="ms-opt"><input type="checkbox" id="monthAll" onchange="toggleAllMs('month', this.checked)"> <b>All months</b></label>`
    + `<div class="ms-divider"></div>`
    + AVAILABLE_MONTHS.map(m =>
        `<label class="ms-opt"><input type="checkbox" value="${m}" ${selectedMonths.has(m) ? "checked" : ""} onchange="onMsChange('month', ${m}, this.checked)"> ${MONTH_NAMES[m-1]}</label>`
      ).join("");
  const yp = document.getElementById("yearMsPanel");
  yp.innerHTML =
    `<label class="ms-opt"><input type="checkbox" id="yearAll" onchange="toggleAllMs('year', this.checked)"> <b>All years</b></label>`
    + `<div class="ms-divider"></div>`
    + AVAILABLE_YEARS.map(y =>
        `<label class="ms-opt"><input type="checkbox" value="${y}" ${selectedYears.has(y) ? "checked" : ""} onchange="onMsChange('year', ${y}, this.checked)"> ${y}</label>`
      ).join("");
  updateMsButtons();
}

function updateMsButtons() {
  const mBtn = document.getElementById("monthMsBtn");
  if (selectedMonths.size === 0) mBtn.textContent = "None";
  else if (selectedMonths.size === 1) mBtn.textContent = MONTH_NAMES[[...selectedMonths][0]-1];
  else if (selectedMonths.size === AVAILABLE_MONTHS.length) mBtn.textContent = "All months";
  else mBtn.textContent = selectedMonths.size + " months";
  const yBtn = document.getElementById("yearMsBtn");
  if (selectedYears.size === 0) yBtn.textContent = "None";
  else if (selectedYears.size === 1) yBtn.textContent = String([...selectedYears][0]);
  else if (selectedYears.size === AVAILABLE_YEARS.length) yBtn.textContent = "All years";
  else yBtn.textContent = selectedYears.size + " years";
  const ma = document.getElementById("monthAll"); if (ma) ma.checked = selectedMonths.size === AVAILABLE_MONTHS.length;
  const ya = document.getElementById("yearAll"); if (ya) ya.checked = selectedYears.size === AVAILABLE_YEARS.length;
}

function toggleMs(evt, id) {
  evt.stopPropagation();
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains("open");
  document.querySelectorAll(".ms.open").forEach(x => x.classList.remove("open"));
  if (!wasOpen) el.classList.add("open");
}

function onMsChange(kind, val, checked) {
  const set = kind === "month" ? selectedMonths : selectedYears;
  if (checked) set.add(val); else set.delete(val);
  updateMsButtons();
  loadSelection();
}

function toggleAllMs(kind, checked) {
  const set = kind === "month" ? selectedMonths : selectedYears;
  const all = kind === "month" ? AVAILABLE_MONTHS : AVAILABLE_YEARS;
  set.clear();
  if (checked) all.forEach(v => set.add(v));
  renderMsPanels();
  loadSelection();
}

let CURRENT_DATA = null;                 // the raw month JSON, kept for region re-filtering
let CURRENT_CHANNELS_SORTED = [];        // all channels for the month, sorted
let CURRENT_REGION = "ALL";              // "ALL" | "MH US" | "MH EU"

function onRegionChange() {
  CURRENT_REGION = document.getElementById("regionSelect").value;
  applyRegionFilter();
}

// Render the region tiles, overall KPIs and channel list for the currently
// selected region (or everything when "Select all").
function applyRegionFilter() {
  const data = CURRENT_DATA;
  if (!data) return;
  const region = CURRENT_REGION;
  const channels = region === "ALL"
    ? CURRENT_CHANNELS_SORTED
    : CURRENT_CHANNELS_SORTED.filter(c => c.region === region);
  const regions = region === "ALL"
    ? (data.regions || [])
    : (data.regions || []).filter(r => r.region === region);

  const totals = computeOverall(channels);
  const daysCompletedForAvg = data.days_completed != null ? data.days_completed : Math.max(0, (data.days_elapsed || 0) - 1);

  document.getElementById("regions").innerHTML = regions.map(regionCardHtml).join("");
  document.getElementById("regionSection").style.display = "block";

  document.getElementById("overall").innerHTML = overallHtml(totals, daysCompletedForAvg, data.days_in_month);
  document.getElementById("overallSection").style.display = "block";

  // Reset drill-down state, then render the filtered channels.
  CH_STATE = {
    channels: channels,
    trees: channels.map(c => buildCategoryTree(c.skus || [], c)),
    daysCompleted: daysCompletedForAvg,
    daysInMonth: data.days_in_month,
  };
  openChannels.clear();
  for (const k in openCat) delete openCat[k];
  for (const k in openListing) delete openListing[k];
  renderChannels();
  document.getElementById("channelSection").style.display = "block";
}

const MONTH_CACHE = {};  // "YYYY-MM" -> parsed json (or null if missing)
async function fetchMonth(year, month) {
  const key = `${year}-${String(month).padStart(2, "0")}`;
  if (key in MONTH_CACHE) return MONTH_CACHE[key];
  try {
    const resp = await fetch(`data/${key}.json`, { cache: "no-store" });
    MONTH_CACHE[key] = resp.ok ? await resp.json() : null;
  } catch (e) {
    MONTH_CACHE[key] = null;
  }
  return MONTH_CACHE[key];
}

// Combine several months' data into one object of the same shape (Power BI
// "total"): sum per-channel and per-SKU figures, re-roll regions, sum day
// counts. A single month is returned as-is.
function aggregateMonths(list) {
  if (list.length === 1) return list[0];
  const sourceRank = { sku: 3, channel_only: 2, none: 1 };
  const chMap = new Map();  // name|||region -> channel
  for (const data of list) {
    for (const c of (data.channels || [])) {
      const key = c.name + "|||" + c.region;
      let agg = chMap.get(key);
      if (!agg) {
        agg = { name: c.name, region: c.region, target_units: 0, target_revenue: 0,
                actual_units: 0, actual_revenue: 0, projected_revenue: 0,
                has_actual_file: false, has_target_data: false,
                target_source: "none", _rank: 0, _skus: new Map() };
        chMap.set(key, agg);
      }
      agg.target_units += c.target_units || 0;
      agg.target_revenue += c.target_revenue || 0;
      agg.actual_units += c.actual_units || 0;
      agg.actual_revenue += c.actual_revenue || 0;
      agg.projected_revenue += c.projected_revenue || 0;
      agg.has_actual_file = agg.has_actual_file || !!c.has_actual_file;
      agg.has_target_data = agg.has_target_data || !!c.has_target_data;
      const r = sourceRank[c.target_source] || 0;
      if (r > agg._rank) { agg._rank = r; agg.target_source = c.target_source; }
      for (const s of (c.skus || [])) {
        let sa = agg._skus.get(s.sku);
        if (!sa) {
          sa = { sku: s.sku, category: s.category || null, listing_name: s.listing_name || null,
                 target_units: 0, target_revenue: 0, actual_units: 0, actual_revenue: 0,
                 image_url: s.image_url || null };
          agg._skus.set(s.sku, sa);
        }
        sa.target_units += s.target_units || 0;
        sa.target_revenue += s.target_revenue || 0;
        sa.actual_units += s.actual_units || 0;
        sa.actual_revenue += s.actual_revenue || 0;
        if (!sa.category && s.category) sa.category = s.category;
        if (!sa.listing_name && s.listing_name) sa.listing_name = s.listing_name;
        if (!sa.image_url && s.image_url) sa.image_url = s.image_url;
      }
    }
  }
  const round2 = n => Math.round(n * 100) / 100;
  const channels = [...chMap.values()].map(c => {
    const skus = [...c._skus.values()].map(s => ({
      sku: s.sku, category: s.category, listing_name: s.listing_name,
      target_units: s.target_units, target_revenue: round2(s.target_revenue),
      actual_units: s.actual_units, actual_revenue: round2(s.actual_revenue),
      image_url: s.image_url,
    }));
    return { name: c.name, region: c.region, target_units: c.target_units,
      target_revenue: round2(c.target_revenue), actual_units: c.actual_units,
      actual_revenue: round2(c.actual_revenue), projected_revenue: round2(c.projected_revenue),
      has_actual_file: c.has_actual_file, has_target_data: c.has_target_data,
      target_source: c.target_source, skus };
  });
  // re-roll regions from channels
  const regMap = new Map();
  for (const c of channels) {
    let r = regMap.get(c.region);
    if (!r) { r = { region: c.region, target_revenue: 0, actual_revenue: 0,
      target_units: 0, actual_units: 0, projected_revenue: 0 }; regMap.set(c.region, r); }
    r.target_revenue += c.target_revenue; r.actual_revenue += c.actual_revenue;
    r.target_units += c.target_units; r.actual_units += c.actual_units;
    r.projected_revenue += c.projected_revenue;
  }
  const regions = [...regMap.values()].map(r => ({ ...r,
    target_revenue: round2(r.target_revenue), actual_revenue: round2(r.actual_revenue),
    projected_revenue: round2(r.projected_revenue) })).sort((a,b)=>a.region.localeCompare(b.region));
  const sum = f => list.reduce((a, d) => a + (d[f] || 0), 0);
  const labels = list.map(d => d.month_label);
  const month_label = labels.length <= 3 ? labels.join(" + ") : labels.length + " periods";
  const generated_at = list.map(d => d.generated_at).sort().slice(-1)[0];
  return { generated_at, month_label, multi: true, periods: labels.length,
    days_elapsed: sum("days_elapsed"), days_completed: sum("days_completed"),
    days_in_month: sum("days_in_month"), regions, channels };
}

async function loadSelection() {
  const statusEl = document.getElementById("status");
  const pairs = MANIFEST_MONTHS.filter(m => selectedYears.has(m.year) && selectedMonths.has(m.month));
  if (pairs.length === 0) {
    ["regionSection","overallSection","channelSection"].forEach(id => document.getElementById(id).style.display = "none");
    statusEl.style.display = "block";
    statusEl.textContent = "No published data for the selected Month/Year combination.";
    document.getElementById("subheader").textContent = "Select at least one month and one year.";
    return;
  }
  pairs.sort((a, b) => a.year - b.year || a.month - b.month);
  const datas = (await Promise.all(pairs.map(p => fetchMonth(p.year, p.month)))).filter(Boolean);
  if (datas.length === 0) {
    statusEl.style.display = "block";
    statusEl.textContent = "Couldn't load data for the selected period(s).";
    return;
  }
  const data = aggregateMonths(datas);
  const updated = data.generated_at ? new Date(data.generated_at).toLocaleString() : "—";
  document.getElementById("subheader").textContent = data.multi
    ? `${data.month_label} — updated ${updated} · ${data.days_completed}/${data.days_in_month} days across ${data.periods} periods`
    : `${data.month_label} — updated ${updated} · day ${data.days_elapsed} of ${data.days_in_month}`;

  CURRENT_DATA = data;
  CURRENT_CHANNELS_SORTED = sortByAchievement(data.channels || []);
  applyRegionFilter();
  statusEl.style.display = "none";
}

async function loadDashboard() {
  const statusEl = document.getElementById("status");
  try {
    const resp = await fetch("data/manifest.json", { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " loading manifest.json");
    const manifest = await resp.json();
    CURRENT_MANIFEST = manifest;
    MANIFEST_MONTHS = manifest.months || [];
    AVAILABLE_YEARS = [...new Set(MANIFEST_MONTHS.map(m => m.year))].sort((a, b) => a - b);
    AVAILABLE_MONTHS = [...new Set(MANIFEST_MONTHS.map(m => m.month))].sort((a, b) => a - b);
    // Default: the current effective month only.
    const def = pickDefaultMonth(MANIFEST_MONTHS, new Date());
    selectedYears.add(def.year);
    selectedMonths.add(def.month);
    renderMsPanels();
    await loadSelection();
  } catch (err) {
    statusEl.textContent = "Couldn't load data/manifest.json (" + err.message + "). Make sure the dashboard workflow has run at least once.";
  }
}

// Close any open multi-select panel when clicking outside it.
document.addEventListener("click", (e) => {
  if (!e.target.closest(".ms")) document.querySelectorAll(".ms.open").forEach(x => x.classList.remove("open"));
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

loadDashboard();
</script>
